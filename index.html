<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李丹阳 · AI 应用与产品作品集</title>
<meta name="description" content="李丹阳，南开大学经济学类本科。展示 BoHack 共序·港乡、Leo Learning OS 与 AI 应用实践。">
<style>
*{box-sizing:border-box}
:root{
  --bg:#080C16; --bg-elev:#0B1120; --card:#111A2C; --card-2:#0E1524;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.18);
  --tx:#EDF0F5; --tx-2:#A8B2C4; --tx-3:#6D7789;
  --gold:#C9A961; --gold-2:#E8D6A8; --gold-soft:rgba(201,169,97,.12);
  --silver:#9AA6BC; --silver-2:rgba(154,166,188,.38); --silver-mist:rgba(154,166,188,.10); --silver-fog:rgba(154,166,188,.055);
  --azure:#5B8DEF;
  --nav-bg:rgba(8,12,22,.72);
  --badge-bg:rgba(201,169,97,.10);
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --btn-primary-tx:#141008;
  --code-bg:#0A101E;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme=light]{
  --bg:#FBFBFD; --bg-elev:#FFFFFF; --card:#FFFFFF; --card-2:#F5F7FA;
  --line:#E6E9F0; --line-2:#CFD6E2;
  --tx:#0A0F1C; --tx-2:#4B556A; --tx-3:#8A93A5;
  --gold:#A98545; --gold-2:#8C6D33; --gold-soft:rgba(169,133,69,.10);
  --silver:#8B96AB; --silver-2:rgba(139,150,171,.42); --silver-mist:rgba(139,150,171,.14); --silver-fog:rgba(139,150,171,.09);
  --azure:#2F5FD0;
  --nav-bg:rgba(251,251,253,.78);
  --badge-bg:rgba(169,133,69,.10);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 28px rgba(16,24,40,.07);
  --btn-primary-tx:#FFFFFF;
  --code-bg:#0F1729;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16.5px;line-height:1.72;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
img{max-width:100%;display:block}
::selection{background:var(--gold-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
@media(min-width:768px){.wrap{padding:0 32px}}
.mono{font-family:var(--mono)}

/* ---------- 顶部导航 ---------- */
header.top{position:sticky;top:0;z-index:60;background:transparent;border-bottom:1px solid transparent;transition:background .24s,border-color .24s;backdrop-filter:blur(14px)}
header.top.on{background:var(--nav-bg);border-bottom-color:var(--line)}
.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-size:15.5px;font-weight:600;white-space:nowrap}
.badge{width:31px;height:31px;border-radius:8px;border:1px solid var(--line-2);background:var(--badge-bg);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
nav.menu{display:none;gap:20px}
nav.menu a{font-size:14.5px;color:var(--tx-2);position:relative;padding:4px 0;transition:color .18s;white-space:nowrap}
nav.menu a:hover{color:var(--tx)}
nav.menu a.active{color:var(--tx)}
nav.menu a.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold)}
.acts{display:flex;align-items:center;gap:7px}
.ico{height:34px;min-width:34px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--tx-2);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-family:var(--mono);transition:.18s}
.ico:hover{border-color:var(--gold);color:var(--gold)}
.burger{display:none}
@media(max-width:1099px){.burger{display:inline-flex}nav.menu{display:none!important}}
@media(min-width:1100px){nav.menu{display:flex}.menu-m{display:none!important}}
.menu-m{position:fixed;inset:0;z-index:70;background:var(--bg);padding:88px 24px 32px;display:flex;flex-direction:column;gap:4px;
  transform:translateY(-100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);overflow-y:auto}
.menu-m.open{transform:none}
.menu-m a{font-size:22px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--tx-2)}
.menu-m a.active{color:var(--tx)}
.menu-m .close{position:absolute;top:16px;right:22px}

/* ---------- 通用 ---------- */
section.sec{padding:62px 0}
@media(min-width:768px){section.sec{padding:92px 0}}
.sec-head{max-width:680px;margin-bottom:34px}
.kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.sec-head h2{font-size:26px;margin:11px 0 9px}
@media(min-width:768px){.sec-head h2{font-size:31px}}
.sec-head p{color:var(--tx-2);font-size:15.5px;margin:0}
.grid{display:grid;gap:17px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
@media(min-width:640px){.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;transition:border-color .18s,transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.card h3{font-size:18.5px;line-height:1.45;margin-bottom:8px}
.card .desc{color:var(--tx-2);font-size:14.5px;margin:0 0 16px;flex:1}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--tx-3);letter-spacing:.06em;margin-bottom:14px}
.meta-row .t{color:var(--gold)}
.stat{font-family:var(--mono);font-size:13.5px;color:var(--tx);border-top:1px solid var(--line);padding-top:13px;margin-bottom:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--tx-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.g{color:var(--gold);border-color:var(--gold-soft);background:var(--gold-soft)}
.card-acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
.more{margin-top:15px;font-size:14px;color:var(--gold);display:inline-flex;align-items:center;gap:6px}
.card:hover .more{gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;
  border:1px solid var(--line-2);background:transparent;color:var(--tx);font-size:15px;transition:.18s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--btn-primary-tx);font-weight:500}
.btn.primary:hover{filter:brightness(1.08);color:var(--btn-primary-tx)}
.btn.sm{height:37px;padding:0 14px;font-size:13.5px;border-radius:9px}
.btn.danger:hover{border-color:#E06B6B;color:#E06B6B}
.btns{display:flex;flex-wrap:wrap;gap:11px}
.note{background:var(--card-2);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:10px;padding:13px 17px;font-size:14px;color:var(--tx-2)}
.note.plain{border-left-color:var(--line-2)}
.divider{height:1px;background:var(--line);border:0;margin:0}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* ---------- Hero ---------- */
.hero{position:relative;padding:66px 0 46px;overflow:hidden;
  background-image:radial-gradient(760px 320px at 10% -8%,var(--gold-soft),transparent 62%),
    linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:auto,52px 52px,52px 52px;background-position:0 0,-1px -1px,-1px -1px}
@media(min-width:768px){.hero{padding:96px 0 70px}}
.hero-grid{display:grid;gap:40px}
@media(min-width:1000px){.hero-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:52px;align-items:end}}
.hero h1{font-size:clamp(36px,8vw,66px);line-height:1.08;letter-spacing:-.03em;margin:14px 0 0}
.hero .en{font-family:var(--mono);font-size:clamp(12px,2.6vw,14.5px);letter-spacing:.2em;color:var(--tx-3);margin-top:12px;text-transform:uppercase}
.hero .handle{font-family:var(--mono);font-size:13px;color:var(--gold);margin-top:10px}
.hero .role{font-size:clamp(14px,3vw,16px);color:var(--tx-2);margin-top:16px}
.hero .rule{width:44px;height:2px;background:var(--gold);margin:24px 0 20px}
.hero .tagline{font-size:clamp(17px,3.4vw,22px);line-height:1.6;color:var(--tx);max-width:530px;margin:0 0 16px}
.hero .sub{color:var(--tx-2);font-size:15px;margin:0 0 24px;max-width:540px}
.cc-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.cc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 14px;
  font-size:14px;color:var(--tx-2);background:transparent;transition:.18s}
.cc:hover{border-color:var(--gold);color:var(--gold)}
.cc .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--tx-3)}
.focus{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.focus h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--tx-3);font-weight:400;margin-bottom:16px;text-transform:uppercase}
.focus-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.focus-item:last-child{border-bottom:0;padding-bottom:0}
.focus-item .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:9px;flex:0 0 5px}
.focus-item small{display:block;color:var(--tx-3);font-size:12.5px;font-family:var(--mono);letter-spacing:.04em}

/* ---------- 祥云纹（银色点缀） ---------- */
svg.xy{display:block}
.bg-xy{position:fixed;inset:0;z-index:0;pointer-events:none;user-select:none;color:var(--silver-mist)}
.bg-xy svg{width:100%;height:100%;display:block}
header.top{z-index:60}
main#app,footer.ft{position:relative;z-index:1}
.hero-xy{position:absolute;right:-90px;top:-50px;width:660px;max-width:66vw;height:auto;
  color:var(--silver-2);opacity:.5;pointer-events:none;user-select:none}
.hero-xy2{position:absolute;left:-120px;bottom:-70px;width:480px;max-width:52vw;height:auto;
  color:var(--silver-2);opacity:.4;pointer-events:none;user-select:none}
@media(min-width:768px){
  .hero-xy{right:-50px;top:-30px;width:760px;opacity:.55}
  .hero-xy2{left:-80px;bottom:-60px;width:540px}
}
.kick{display:flex;align-items:center;gap:9px}
.kick-xy{width:34px;height:13px;flex:none;color:var(--silver-2)}
.ft{position:relative;overflow:hidden}
.ft-xy{position:absolute;right:-46px;bottom:-34px;width:430px;max-width:52vw;height:auto;
  color:var(--silver-fog);pointer-events:none;user-select:none}
/* 回纹边饰带（传统回字纹，横向重复） */
.fret{position:absolute;left:0;width:100%;height:22px;color:var(--silver-2);opacity:.5;pointer-events:none}
.fret.top{top:0}
.fret.bottom{bottom:0}
@media(max-width:520px){.fret{height:18px;opacity:.42}}

/* ---------- 指标带 ---------- */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media(min-width:700px){.metrics{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1060px){.metrics{grid-template-columns:repeat(5,1fr)}}
.metric{background:var(--card-2);padding:20px 18px}
.metric .v{font-family:var(--mono);font-size:25px;color:var(--gold);line-height:1.2;letter-spacing:-.02em}
.metric .l{font-size:12.5px;color:var(--tx-3);margin-top:7px;line-height:1.55}

/* ---------- 时间轴 ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl-item{position:relative;padding-bottom:30px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-26px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.tl-year{font-family:var(--mono);font-size:12.5px;color:var(--gold);letter-spacing:.06em;margin-bottom:6px}
.tl-item h4{font-size:17px;margin-bottom:4px}
.tl-org{font-size:14px;color:var(--tx-3);margin-bottom:10px}
.tl-item ul{margin:0;padding-left:19px}
.tl-item li{color:var(--tx-2);font-size:14.5px;margin:5px 0}

/* ---------- 分栏标签 ---------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:30px;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:12px 18px;color:var(--tx-3);
  font-size:15px;white-space:nowrap;margin-bottom:-1px;transition:.18s}
.tab:hover{color:var(--tx-2)}
.tab.on{color:var(--tx);border-bottom-color:var(--gold)}

/* ---------- 教育背景 ---------- */
.edu{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.edu-head{display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap}
.edu-logo{width:48px;height:48px;border-radius:11px;background:var(--badge-bg);border:1px solid var(--line-2);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:0 0 48px}
.edu-head .m{flex:1;min-width:210px}
.edu-head h3{font-size:19px;margin-bottom:4px}
.edu-head .s{font-family:var(--mono);font-size:12.5px;color:var(--tx-3);letter-spacing:.04em}
.award-row{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--tx-2)}
.award-row:last-child{border-bottom:0;padding-bottom:0}
.award-row .ic{flex:0 0 18px;color:var(--gold);font-family:var(--mono);font-size:12px;padding-top:3px}
.award-row b{color:var(--tx);font-weight:600}

/* ---------- 项目详情 ---------- */
.back{font-family:var(--mono);font-size:12.5px;color:var(--tx-3);display:inline-flex;gap:7px;align-items:center;margin-bottom:26px}
.back:hover{color:var(--gold)}
.pd-title{font-size:clamp(27px,5.4vw,42px);line-height:1.18;letter-spacing:-.02em;margin:12px 0 16px}
.info-bar{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card-2);margin:26px 0}
.info-bar div{padding:14px 20px;border-right:1px solid var(--line);flex:1 1 150px}
.info-bar .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--tx-3);margin-bottom:5px}
.info-bar .v{font-size:14.5px}
.case{border-top:1px solid var(--line);padding-top:26px;margin-top:38px}
.case .no{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.16em}
.case h3{font-size:22px;margin:9px 0 13px}
.case p{color:var(--tx-2);font-size:15.5px;max-width:770px}
.case ul{margin:0 0 14px;padding-left:20px}
.case li{color:var(--tx-2);font-size:15px;margin:6px 0}
.case li b{color:var(--tx)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:16px 0 6px}
.flow span{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;color:var(--tx-2)}
.flow em{color:var(--gold);font-style:normal}
.todo{border:1px dashed var(--line-2);border-radius:14px;padding:20px 22px;background:var(--card-2)}
.todo .hd{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--tx-3);margin-bottom:12px}
.todo ul{margin:0;padding-left:19px}
.todo li{color:var(--tx-3);font-size:14.5px;margin:5px 0}

/* ---------- 文章 ---------- */
.post-row{display:flex;gap:20px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line);transition:padding-left .18s}
.post-row:hover{padding-left:8px}
.post-row .d{font-family:var(--mono);font-size:12.5px;color:var(--tx-3);white-space:nowrap;min-width:84px}
.post-row .b{flex:1;min-width:0}
.post-row h4{font-size:17px;margin-bottom:5px}
.post-row p{margin:0;color:var(--tx-2);font-size:14.5px}
.art-grid{display:grid;gap:36px}
@media(min-width:1000px){.art-grid{grid-template-columns:170px minmax(0,720px);justify-content:center}}
.art-toc{display:none}
@media(min-width:1000px){.art-toc{display:block;position:sticky;top:96px;align-self:start}}
.art-toc h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--tx-3);font-weight:400;margin:0 0 12px}
.art-toc a{display:block;font-size:13px;color:var(--tx-3);padding:5px 0 5px 11px;border-left:1px solid var(--line);cursor:pointer}
.art-toc a:hover{color:var(--gold);border-left-color:var(--gold)}
.art-head{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:26px}
.art-head h1{font-size:clamp(25px,4.6vw,35px);line-height:1.28;margin:12px 0 14px}
.art-head .d{font-family:var(--mono);font-size:12.5px;color:var(--tx-3)}
.prose{font-size:16.5px;line-height:1.85;color:var(--tx-2);max-width:720px}
.prose h2{font-size:23px;color:var(--tx);margin:42px 0 14px;padding-top:8px}
.prose h3{font-size:19px;color:var(--tx);margin:32px 0 10px}
.prose p{margin:0 0 17px}
.prose strong{color:var(--tx);font-weight:600}
.prose a{color:var(--gold);border-bottom:1px solid var(--gold-soft)}
.prose ul,.prose ol{padding-left:22px;margin:0 0 18px}
.prose li{margin:7px 0}
.prose blockquote{margin:22px 0;padding:4px 0 4px 18px;border-left:2px solid var(--gold);color:var(--tx);font-size:16.5px}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:1.5px 6px;color:var(--tx)}
.prose pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:17px 19px;overflow-x:auto;margin:0 0 20px}
.prose pre code{background:transparent;border:0;padding:0;font-size:13.5px;line-height:1.7;color:#D6DEEA}
.prose table{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 20px}
.prose th,.prose td{border:1px solid var(--line);padding:9px 12px;text-align:left}
.prose th{color:var(--tx);background:var(--card-2);font-weight:500}
.prose hr{border:0;border-top:1px solid var(--line);margin:34px 0}
.editor{margin:26px 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card-2)}
.editor .eh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--tx-3);font-family:var(--mono);flex-wrap:wrap}
.editor textarea{width:100%;min-height:320px;border:0;background:transparent;color:var(--tx);font-family:var(--mono);font-size:13.5px;line-height:1.75;padding:16px;resize:vertical;outline:none}
.editor .ef{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}

/* ---------- 表单 ---------- */
.fld{display:block;margin-bottom:18px}
.fld>span{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--tx-3);margin-bottom:7px;text-transform:uppercase}
.fld input,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;color:var(--tx);font-family:inherit;font-size:15px;outline:none;transition:border-color .18s}
.fld input:focus,.fld textarea:focus{border-color:var(--gold)}
.fld textarea.mdin{font-family:var(--mono);font-size:13.5px;line-height:1.75;min-height:340px;resize:vertical}

/* ---------- 空状态 ---------- */
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:48px 26px;text-align:center;background:var(--card-2)}
.empty h3{font-size:19px;color:var(--tx);margin-bottom:9px}
.empty p{color:var(--tx-2);font-size:14.5px;max-width:460px;margin:0 auto 20px}

/* ---------- 页脚 ---------- */
footer.ft{border-top:1px solid var(--line);margin-top:40px;padding:54px 0 32px;background:var(--bg-elev)}
.ft-grid{display:grid;gap:32px}
@media(min-width:768px){.ft-grid{grid-template-columns:1.5fr 1fr 1fr}}
.ft h5{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--tx-3);font-weight:400;margin-bottom:14px;text-transform:uppercase}
.ft a{display:block;font-size:14.5px;color:var(--tx-2);padding:4px 0}
.ft a:hover{color:var(--gold)}
.ft .who{font-size:18px;margin-bottom:10px}
.ft-bottom{border-top:1px solid var(--line);margin-top:38px;padding-top:20px;font-size:12.5px;color:var(--tx-3);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cta-band{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 26px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between}
@media(min-width:768px){.cta-band{padding:42px 42px}}
.cta-band h3{font-size:22px;margin-bottom:8px}
.cta-band p{color:var(--tx-2);margin:0;font-size:15px;max-width:540px}

.cc-row > *{min-width:0;max-width:100%;overflow-wrap:anywhere}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:640px){.cc,.btn,.tab,.ctl,.burger{min-height:44px}}

/* ---------- 极简 Markdown 渲染 ---------- */
function md(src){
  const cache=[]; let s=String(src).replace(/\r/g,"");
  s=s.replace(/\u0060\u0060\u0060(\w*)\n([\s\S]*?)\u0060\u0060\u0060/g,(m,lg,code)=>{cache.push('<pre><code>'+esc(code.replace(/\n$/,""))+'</code></pre>');return "\u0001"+(cache.length-1)+"\u0001";});
  const inline=t=>esc(t)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\u0060(.+?)\u0060/g,"<code>$1</code>")
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g,"<em>$1</em>");
  const lines=s.split("\n"); const out=[]; let mode=null; let buf=[];
  const flush=()=>{
    if(!mode){buf=[];return;}
    if(mode==="ul") out.push("<ul>"+buf.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");
    else if(mode==="ol") out.push("<ol>"+buf.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>");
    else if(mode==="quote") out.push("<blockquote>"+buf.map(x=>inline(x)).join("<br>")+"</blockquote>");
    else if(mode==="table"){
      const rows=buf.map(r=>r.split("|").slice(1,-1).map(c=>c.trim()));
      if(rows.length>1 && /^-+$/.test(rows[1][0].replace(/[\s:]/g,""))) rows.splice(1,1);
      const head=rows.shift()||[];
      out.push('<table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
        rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
    }
    buf=[]; mode=null;
  };
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    const ph=line.match(/^\u0001(\d+)\u0001$/);
    if(ph){ flush(); out.push(cache[+ph[1]]); continue; }
    if(!line){ flush(); continue; }
    if(/^#{1,3}\s/.test(line)){
      flush();
      const lv=line.match(/^#+/)[0].length;
      const txt=line.replace(/^#+\s*/,"");
      const id=slugify(txt);
      if(lv<=2) out.push('<h2 id="'+id+'">'+inline(txt)+'</h2>');
      else out.push("<h3>"+inline(txt)+"</h3>");
      continue;
    }
    if(/^(-{3,}|\*{3,})$/.test(line)){ flush(); out.push("<hr>"); continue; }
    if(/^>\s?/.test(line)){ if(mode!=="quote"){flush();mode="quote";} buf.push(line.replace(/^>\s?/,"")); continue; }
    if(/^[-*]\s+/.test(line)){ if(mode!=="ul"){flush();mode="ul";} buf.push(line.replace(/^[-*]\s+/,"")); continue; }
    if(/^\d+\.\s+/.test(line)){ if(mode!=="ol"){flush();mode="ol";} buf.push(line.replace(/^\d+\.\s+/,"")); continue; }
    if(/^\|.*\|$/.test(line)){ if(mode!=="table"){flush();mode="table";} buf.push(line); continue; }
    flush(); out.push("<p>"+inline(line)+"</p>");
  }
  flush();
  return out.join("");
}
function headingsOf(src){
  const res=[]; String(src).split("\n").forEach(l=>{
    const m=l.trim().match(/^(#{1,2})\s+(.+)$/);
    if(m) res.push({lv:m[1].length,txt:m[2].replace(/\*/g,""),id:slugify(m[2])});
  });
  return res;
}

/* ---------- 复制到剪贴板 ---------- */
function copy(text,label){
  const done=()=>toast((T().copied)+"："+(label||text));
  const fallback=()=>{
    try{
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done();
    }catch(e){ toast(T().copyFail); }
  };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
}

/* =========================================================
   6. 路由与绑定
   ========================================================= */
const app=document.getElementById("app");
let revealObserver;

function observeReveal(){
  if(revealObserver) revealObserver.disconnect();
  const nodes=document.querySelectorAll(".reveal:not(.in)");
  if(!("IntersectionObserver" in window)){ nodes.forEach(n=>n.classList.remove("reveal")); return; }
  revealObserver=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const n=e.target; n.classList.add("in");
        setTimeout(()=>n.classList.remove("reveal","in"),1000);
        revealObserver.unobserve(n);
      }
    });
  },{threshold:.12,rootMargin:"0px 0px -40px 0px"});
  nodes.forEach(n=>revealObserver.observe(n));
}

function route(){
  const h=location.hash||"#/";
  const parts=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  const key=parts[0]||"";
  let html="", active=-1, scrollTop=true;
  if(!key){ html=pageHome(); active=0; }
  else if(key==="projects"){ html=parts[1]?pageProject(parts[1]):pageProjects(); active=2; }
  else if(key==="ai"){ html=pageAI(); active=1; }
  else if(key==="experience"){ html=pageExperience(); active=3; }
  else if(key==="skills"){ html=pageSkills(); active=4; }
  else if(key==="growth"){ html=pageGrowth(); active=5; }
  else if(key==="new"){ html=pageNew(); active=5; }
  else if(key==="post"){ html=pagePost(parts[1]); active=5; scrollTop=false; }
  else if(key==="education"){ html=pageEducation(); active=-1; }
  else if(key==="about"){ html=pageAbout(); active=-1; }
  else html=page404();

  app.innerHTML=html;
  renderNav(active);
  observeReveal();
  if(scrollTop) window.scrollTo({top:0,behavior:"auto"});
  if(key==="post"){ bindPost(parts[1]); if(scrollTop) window.scrollTo({top:0,behavior:"auto"}); }
  if(key==="new") bindNew();
  if(key==="experience") bindTabs();
  bindCopy();
}

function bindCopy(){
  document.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick=()=>copy(b.getAttribute("data-copy"));
  });
}
function bindTabs(){
  const bar=document.getElementById("expTabs");
  if(!bar) return;
  bar.querySelectorAll(".tab").forEach(btn=>{
    btn.onclick=()=>{
      bar.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
      btn.classList.add("on");
      document.querySelectorAll("[data-panel]").forEach(p=>{
        if(p.getAttribute("data-panel")===btn.getAttribute("data-p")) p.removeAttribute("hidden");
        else p.setAttribute("hidden","hidden");
      });
      observeReveal();
    };
  });
}
function bindNew(){
  const save=document.getElementById("npSave");
  if(!save) return;
  const out=document.getElementById("npOut");
  document.getElementById("npPreview").onclick=()=>{
    out.innerHTML=md(document.getElementById("npBody").value||"");
    out.scrollIntoView({behavior:"smooth",block:"start"});
  };
  save.onclick=()=>{
    const title=(document.getElementById("npTitle").value||"").trim();
    const body=document.getElementById("npBody").value||"";
    if(!title || !body.trim()){ toast(lang==="zh"?"标题和正文不能为空":"Title and body cannot be empty"); return; }
    const cat=(document.getElementById("npCat").value||"").trim();
    const sum=(document.getElementById("npSum").value||"").trim();
    const d=new Date();
    const date=d.toISOString().slice(0,10);
    let slug=slugify(title)||("post-"+d.getTime());
    const exist=new Set(drafts().map(x=>x.slug).concat(DATA.posts.map(x=>x.slug)));
    if(exist.has(slug)) slug=slug+"-"+d.getTime().toString().slice(-4);
    const mins=Math.max(1,Math.round(body.length/400));
    const arr=drafts();
    arr.push({slug,date,cat,title,sum,body,mins});
    saveDrafts(arr);
    toast(T().saved);
    location.hash="#/post/"+slug;
  };
}
function bindPost(slug){
  const p=findPost(slug);
  if(!p) return;
  const btn=document.getElementById("editBtn");
  const box=document.getElementById("editor");
  if(!btn||!box) return;
  const ta=document.getElementById("mdtxt");
  btn.onclick=()=>{ box.hidden=!box.hidden; if(!box.hidden) ta.focus(); };
  document.getElementById("saveMd").onclick=()=>{
    const arr=drafts();
    const i=arr.findIndex(x=>x.slug===slug);
    const body=ta.value;
    if(i>-1){ arr[i].body=body; arr[i].mins=Math.max(1,Math.round(body.length/400)); }
    else { arr.push({slug,date:p.date,cat:p.cat,title:p.title,sum:p.sum,body,mins:Math.max(1,Math.round(body.length/400))}); }
    saveDrafts(arr);
    document.getElementById("prose").innerHTML=md(body);
    toast(T().saved);
  };
  document.getElementById("resetMd").onclick=()=>{
    ta.value=p.body||"";
    document.getElementById("prose").innerHTML=md(p.body||"");
  };
  const del=document.getElementById("delBtn");
  if(del) del.onclick=()=>{
    saveDrafts(drafts().filter(x=>x.slug!==slug));
    toast(T().deleted);
    location.hash="#/growth";
  };
  document.querySelectorAll(".toclink").forEach(a=>{
    a.onclick=()=>{
      const t=document.getElementById(a.getAttribute("data-t"));
      if(t) t.scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}
function toast(msg){
  const d=el(`<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:var(--card);
    border:1px solid var(--line-2);color:var(--tx);border-radius:10px;padding:11px 20px;font-size:14px;box-shadow:var(--shadow);max-width:90vw">${msg}</div>`);
  document.body.appendChild(d); setTimeout(()=>d.remove(),2400);
}

function renderNav(active){
  const t=T(); const c=DATA.contact;
  const links=t.nav.map((n,i)=>`<a href="${t.navHash[i]}" class="${i===active?"active":""}">${n}</a>`).join("");
  document.getElementById("menu").innerHTML=links;
  document.getElementById("menuMLinks").innerHTML=links+`<a href="#/education">${t.eduTitle}</a><a href="#/about">${lang==="zh"?"关于我":"About"}</a>`;
  document.getElementById("brandName").textContent=lang==="zh"?DATA.name.zh:DATA.name.en;
  document.getElementById("ftDesc").textContent=t.ftDesc;
  document.getElementById("ftTags").innerHTML=DATA.tags.map(x=>`<span class="tag">${L(x)}</span>`).join("");
  document.getElementById("ftNavTitle").textContent=t.ftNav;
  document.getElementById("ftNav").innerHTML=t.nav.map((n,i)=>`<a href="${t.navHash[i]}">${n}</a>`).join("")+
    `<a href="#/education">${t.eduTitle}</a><a href="#/about">${lang==="zh"?"关于我":"About"}</a>`;
  document.getElementById("ftContactTitle").textContent=t.ftContact;
  document.getElementById("ftContact").innerHTML=
    `<a href="mailto:${c.email}">${c.email}</a>`+
    `<a href="javascript:void(0)" data-copy="${c.wechat}">${t.wechat}：${c.wechat}</a>`+
    `<a href="javascript:void(0)" data-copy="${c.phone}">${t.phone}：${c.phone}</a>`+
    ``;
  document.getElementById("ftCopy").textContent=t.copy;
  document.getElementById("ftNote").textContent=t.note;
  document.getElementById("ftSrc").textContent="";
  document.documentElement.lang=lang==="zh"?"zh-CN":"en";
  document.title=lang==="zh"?"李丹阳 · AI 应用与产品作品集"
                            :"Dan Yang Li · Applied AI & Product Portfolio";
  document.querySelectorAll("#ftContact [data-copy]").forEach(b=>{ b.onclick=()=>copy(b.getAttribute("data-copy")); });
}

window.addEventListener("scroll",onScroll,{passive:true}); onScroll();

  lang=lang==="zh"?"en":"zh";

  route();
};

  document.documentElement.setAttribute("data-theme",nx);

};

if(savedTheme) document.documentElement.setAttribute("data-theme",savedTheme);

window.addEventListener("hashchange",route);
route();
